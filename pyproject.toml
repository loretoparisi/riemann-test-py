[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "riemann-lab"
version = "0.2.0"
description = "Numerical experiments around the Riemann Hypothesis: zeros, explicit formulas, equivalent criteria, GUE statistics"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "mpmath", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]
rigorous = ["python-flint"]   # Arb ball arithmetic for li_rigorous (falls back to mpmath.iv)

[tool.setuptools]
packages = ["riemann_lab"]
